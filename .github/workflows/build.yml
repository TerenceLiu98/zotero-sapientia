name: Build and release Sapientia

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZOTERO_VERSION: "10.0.8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Validate version tag
        if: github.ref_type == 'tag'
        run: node -e 'if (require("./package.json").releaseTag !== process.env.GITHUB_REF_NAME) throw Error("The Git tag must match package.json releaseTag")'
      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: "git@github.com:"
        run: npm ci
      - run: npm run lint:check
      - run: npm run test:typecheck
      - name: Install pinned Zotero
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgtk-3-0t64 libasound2t64
          archive="$RUNNER_TEMP/zotero.tar.xz"
          zotero_dir="$RUNNER_TEMP/zotero"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://download.zotero.org/client/release/${ZOTERO_VERSION}/Zotero-${ZOTERO_VERSION}_linux-x86_64.tar.xz"
          mkdir "$zotero_dir"
          tar --extract --xz --file "$archive" --directory "$zotero_dir" --strip-components=1
          test -x "$zotero_dir/zotero"
          printf 'ZOTERO_PLUGIN_ZOTERO_BIN_PATH=%s/zotero\n' "$zotero_dir" >> "$GITHUB_ENV"
      - name: Run Zotero fixture tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" npm test
      - name: Build release package
        run: npm run build
      - name: Verify package and prepare checksums
        run: node scripts/release-assets.mjs .scaffold/build/sapientia.xpi "$RUNNER_TEMP/sapientia"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sapientia
          path: ${{ runner.temp }}/sapientia/
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: sapientia-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sapientia
          path: ${{ runner.temp }}/sapientia
      - name: Publish package and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "$RUNNER_TEMP/sapientia"
